<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colin Habursky</title>
<style>
  :root {
    --bg: #f7f8fa;
    --surface: #ffffff;
    --text: #1a1d23;
    --muted: #5b6270;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --border: #e5e7eb;
    --max-width: 860px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  header.hero {
    background: linear-gradient(135deg, #111827, #1f2937);
    color: #fff;
    padding: 4.5rem 1.5rem 3.5rem;
    text-align: center;
  }
  header.hero h1 {
    margin: 0 0 0.4rem;
    font-size: 2.6rem;
    letter-spacing: -0.02em;
  }
